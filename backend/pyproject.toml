[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmatrace-backend"
version = "0.1.0"
description = "PharmaTrace Clinical KUB/KT Hybrid RAG Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "rich>=13.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]